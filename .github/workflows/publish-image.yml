name: Publish Docker Image

on:
  push:
    branches: [master]
    paths:
      - "FSTService/**"
      - "FortniteFestival.Core/**"
      - "FSTService.Tests/**"
      - "FSTService/Dockerfile"
      - "FortniteFestivalWeb/**"
      - "packages/**"
      - "tools/chopt-cli-linux/**"
      - "tools/validate-publish-image-workflow.mjs"
      - ".github/workflows/publish-image.yml"
  pull_request:
    branches: [master]
    paths:
      - "FSTService/**"
      - "FortniteFestival.Core/**"
      - "FSTService.Tests/**"
      - "FortniteFestivalWeb/**"
      - "packages/**"
      - "tools/chopt-cli-linux/**"
      - "tools/validate-publish-image-workflow.mjs"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  FST_IMAGE_NAME: ${{ github.repository_owner }}/fstservice
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/fstfestivalweb

jobs:
  version-bump:
    runs-on: ubuntu-latest

    outputs:
      bumped: ${{ steps.commit.outputs.bumped }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed components
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ZERO_SHA=0000000000000000000000000000000000000000
          is_commit() {
            [ -n "$1" ] &&
              [ "$1" != "$ZERO_SHA" ] &&
              git cat-file -e "$1^{commit}" 2>/dev/null
          }

          case "$EVENT_NAME" in
            push)
              if is_commit "$BEFORE_SHA"; then
                CHANGED=$(git diff --no-renames --name-only "$BEFORE_SHA" "$EVENT_SHA")
              else
                CHANGED=$(git diff-tree --no-renames --root --no-commit-id --name-only -r "$EVENT_SHA")
              fi
              ;;
            pull_request)
              CHANGED=$(git diff --no-renames --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
              ;;
            workflow_dispatch)
              if git rev-parse "$EVENT_SHA^" >/dev/null 2>&1; then
                CHANGED=$(git diff --no-renames --name-only "$EVENT_SHA^" "$EVENT_SHA")
              else
                CHANGED=$(git diff-tree --no-renames --root --no-commit-id --name-only -r "$EVENT_SHA")
              fi
              ;;
            *)
              CHANGED=$(git diff-tree --no-renames --root --no-commit-id --name-only -r "$EVENT_SHA")
              ;;
          esac

          echo "Changed files:"
          echo "$CHANGED"

          echo "bump_enabled=false" >> "$GITHUB_OUTPUT"
          echo "service=false" >> "$GITHUB_OUTPUT"
          echo "web=false" >> "$GITHUB_OUTPUT"
          echo "core_ts=false" >> "$GITHUB_OUTPUT"
          echo "theme_ts=false" >> "$GITHUB_OUTPUT"
          echo "ui_utils=false" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "push" ] && [[ "$HEAD_MESSAGE" != *"[version-bump]"* ]]; then
            echo "bump_enabled=true" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^(FSTService/|FortniteFestival\.Core/)'; then
            echo "service=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^FortniteFestivalWeb/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^packages/core/'; then
            echo "core_ts=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^packages/theme/'; then
            echo "theme_ts=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^packages/ui-utils/'; then
            echo "ui_utils=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(\.github/workflows/publish-image\.yml|tools/validate-publish-image-workflow(\.test)?\.mjs)$'; then
            echo "service=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.bump_enabled == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.core_ts == 'true' || steps.changes.outputs.theme_ts == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        if: steps.changes.outputs.bump_enabled == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.core_ts == 'true' || steps.changes.outputs.theme_ts == 'true')
        run: corepack enable

      - name: Bump FSTService version
        if: steps.changes.outputs.bump_enabled == 'true' && steps.changes.outputs.service == 'true'
        run: |
          CSPROJ="FSTService/FSTService.csproj"
          CURRENT=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' "$CSPROJ")
          if [ -z "$CURRENT" ]; then
            echo "No <Version> found in $CSPROJ, skipping"
            exit 0
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s|<Version>$CURRENT</Version>|<Version>$NEW_VERSION</Version>|" "$CSPROJ"
          echo "FSTService: $CURRENT -> $NEW_VERSION"

      - name: Bump FortniteFestivalWeb version
        if: steps.changes.outputs.bump_enabled == 'true' && steps.changes.outputs.web == 'true'
        run: |
          cd FortniteFestivalWeb
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "FortniteFestivalWeb: $CURRENT -> $NEW_VERSION"

      - name: Bump @festival/core version
        if: steps.changes.outputs.bump_enabled == 'true' && steps.changes.outputs.core_ts == 'true'
        run: |
          cd packages/core
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "@festival/core: $CURRENT -> $NEW_VERSION"

      - name: Bump @festival/theme version
        if: steps.changes.outputs.bump_enabled == 'true' && steps.changes.outputs.theme_ts == 'true'
        run: |
          cd packages/theme
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "@festival/theme: $CURRENT -> $NEW_VERSION"

      - name: Bump @festival/ui-utils version
        if: steps.changes.outputs.bump_enabled == 'true' && steps.changes.outputs.ui_utils == 'true'
        run: |
          cd packages/ui-utils
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "@festival/ui-utils: $CURRENT -> $NEW_VERSION"

      - name: Install web dependencies
        if: steps.changes.outputs.bump_enabled == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.core_ts == 'true' || steps.changes.outputs.theme_ts == 'true')
        working-directory: FortniteFestivalWeb
        run: yarn install --immutable

      - name: Regenerate dependency license manifest
        if: steps.changes.outputs.bump_enabled == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.core_ts == 'true' || steps.changes.outputs.theme_ts == 'true')
        working-directory: FortniteFestivalWeb
        run: yarn licenses:generate

      - name: Regenerate embedded web bundle
        if: steps.changes.outputs.bump_enabled == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.core_ts == 'true' || steps.changes.outputs.theme_ts == 'true')
        working-directory: FortniteFestivalWeb
        run: yarn build

      - name: Remove transient web build state
        if: steps.changes.outputs.bump_enabled == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.core_ts == 'true' || steps.changes.outputs.theme_ts == 'true')
        run: |
          git restore --source=HEAD -- FortniteFestivalWeb/.yarn/install-state.gz
          rm -f FortniteFestivalWeb/tsconfig.tsbuildinfo

      - name: Create version bump commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto version bump [version-bump]"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify version-bumped embedded bundle
        if: steps.changes.outputs.bump_enabled == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.core_ts == 'true' || steps.changes.outputs.theme_ts == 'true')
        working-directory: FortniteFestivalWeb
        run: yarn embedded:check

      - name: Push version bump commit
        if: steps.commit.outputs.bumped == 'true'
        run: git push

  test:
    needs: [version-bump]
    # Run even when version-bump is skipped (PRs, workflow_dispatch, version-bump commits)
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore FSTService.Tests/FSTService.Tests.csproj

      - name: Build
        run: dotnet build FSTService.Tests/FSTService.Tests.csproj -c Release --no-restore

      - name: Run tests with coverage
        run: >
          dotnet test FSTService.Tests/FSTService.Tests.csproj
          -c Release --no-build
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"
          --settings FSTService.Tests/coverage.runsettings

      - name: Enforce minimum line coverage for FSTService
        shell: bash
        env:
          COVERAGE_THRESHOLD: 94
        run: |
          REPORT=$(find TestResults -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$REPORT" ]; then
            echo "::error::No coverage report found"
            exit 1
          fi

          # Extract line-rate for the FSTService package specifically.
          # The Cobertura XML has <package name="FSTService" line-rate="0.xx" ...>.
          # We use sed (not grep -P) to avoid variable-length lookbehind issues.
          LINE_RATE=$(sed -n 's/.*<package[^>]*name="FSTService"[^>]*line-rate="\([^"]*\)".*/\1/p' "$REPORT" | head -1)

          # Fallback: if no FSTService-specific package found, use the top-level rate
          if [ -z "$LINE_RATE" ]; then
            LINE_RATE=$(sed -n 's/.*<coverage[^>]*line-rate="\([^"]*\)".*/\1/p' "$REPORT" | head -1)
          fi

          if [ -z "$LINE_RATE" ]; then
            echo "::error::Could not parse line-rate from coverage report"
            exit 1
          fi

          PERCENT=$(echo "$LINE_RATE * 100" | bc -l)
          PERCENT_FMT=$(printf "%.2f" "$PERCENT")
          echo "FSTService line coverage: ${PERCENT_FMT}%"

          PASS=$(echo "$PERCENT >= $COVERAGE_THRESHOLD" | bc -l)
          if [ "$PASS" -ne 1 ]; then
            echo "::error::Coverage ${PERCENT_FMT}% is below the ${COVERAGE_THRESHOLD}% threshold"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/**/coverage.cobertura.xml

  test-web:
    needs: [version-bump]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Validate publish workflow contract
        run: |
          node --test tools/validate-publish-image-workflow.test.mjs
          node tools/validate-publish-image-workflow.mjs

      - name: Install dependencies
        working-directory: FortniteFestivalWeb
        run: yarn install --immutable

      - name: Build
        working-directory: FortniteFestivalWeb
        run: yarn build

      - name: Verify committed embedded bundle
        working-directory: FortniteFestivalWeb
        run: yarn embedded:check

      - name: Run unit tests
        working-directory: FortniteFestivalWeb
        run: yarn test:unit

      - name: Enforce unit coverage
        working-directory: FortniteFestivalWeb
        run: yarn test:coverage

      - name: Run shared package tests
        working-directory: FortniteFestivalWeb
        run: yarn test:shared

      - name: Enforce shared package coverage
        working-directory: FortniteFestivalWeb
        run: yarn test:shared:coverage

      - name: Check dependency licenses
        working-directory: FortniteFestivalWeb
        run: yarn licenses:check

      - name: Check generated Manual images
        working-directory: FortniteFestivalWeb
        run: yarn manual:images:check

      - name: Install Playwright browsers
        working-directory: FortniteFestivalWeb
        run: yarn playwright install --with-deps chromium webkit

      - name: Run browser tests
        working-directory: FortniteFestivalWeb
        run: yarn e2e:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-playwright-failure
          if-no-files-found: ignore
          path: |
            FortniteFestivalWeb/test-results
            FortniteFestivalWeb/blob-report

  build-and-push-service:
    needs: [version-bump, test, test-web]
    # Run on push/dispatch after version-bump completes (or is skipped).
    if: |-
      always()
      && !failure() && !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract FSTService metadata
        id: meta-fst
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FST_IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ needs.version-bump.outputs.commit_sha || github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ needs.version-bump.outputs.commit_sha || github.sha }}

      - name: Build and push FSTService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: FSTService/Dockerfile
          push: true
          tags: ${{ steps.meta-fst.outputs.tags }}
          labels: ${{ steps.meta-fst.outputs.labels }}

  build-and-push-web:
    needs: [version-bump, test-web]
    # Run on push/dispatch after version-bump completes (or is skipped).
    if: |-
      always()
      && !failure() && !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract FestivalWeb metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ needs.version-bump.outputs.commit_sha || github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ needs.version-bump.outputs.commit_sha || github.sha }}

      - name: Build and push FestivalWeb
        uses: docker/build-push-action@v6
        with:
          context: .
          file: FortniteFestivalWeb/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
