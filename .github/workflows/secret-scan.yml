name: Secret scan

on:
  pull_request:
  push:
    branches:
      - master
      - postgres-improvements

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/secret-scan.test.mjs
      - run: node tools/secret-scan.mjs
