# docker-compose.yml for the remote Docker host machine.
# Place this file (and optionally a .env with overrides) on the host.
#
# First-time setup:
#   1. Create a GitHub PAT with read:packages scope.
#   2. echo YOUR_PAT | docker login ghcr.io -u SFenton --password-stdin
#
# Preferred usage:
#   ./fst-compose.sh pull
#   ./fst-compose.sh up -d  # core/API/web only; guard starts fstworker
#
# The wrapper honors FST_DEPLOY_COMPOSE_DIR from the environment, repo .env, or
# deploy/.env. Set it on hosts that keep the live Compose project elsewhere
# (for example /home/sfenton/Docker/FestivalServiceTracker) so this template
# does not create a competing Compose project with the same container names.

x-fst-postgres-resources: &fst-postgres-resources
  # Persistent HA-safe guardrails for future recreates; do not reserve memory.
  mem_limit: ${FST_POSTGRES_MEM_LIMIT:-16g}
  memswap_limit: ${FST_POSTGRES_MEMSWAP_LIMIT:-20g}
  cpus: ${FST_POSTGRES_CPUS:-6.0}
  cpu_shares: 768

x-fst-api-resources: &fst-api-resources
  mem_limit: ${FST_API_MEM_LIMIT:-2g}
  memswap_limit: ${FST_API_MEMSWAP_LIMIT:-3g}
  cpus: ${FST_API_CPUS:-1.5}
  cpu_shares: 256
  pids_limit: 192

x-fst-worker-resources: &fst-worker-resources
  mem_limit: ${FST_WORKER_MEM_LIMIT:-12g}
  memswap_limit: ${FST_WORKER_MEMSWAP_LIMIT:-14g}
  cpus: ${FST_WORKER_CPUS:-6.0}
  cpu_shares: 512
  pids_limit: 512

x-fst-web-resources: &fst-web-resources
  mem_limit: ${FST_WEB_MEM_LIMIT:-512m}
  memswap_limit: ${FST_WEB_MEMSWAP_LIMIT:-768m}
  cpus: ${FST_WEB_CPUS:-0.5}
  cpu_shares: 128
  pids_limit: 128

x-fst-proxy-resources: &fst-proxy-resources
  mem_limit: ${FST_PROXY_MEM_LIMIT:-256m}
  memswap_limit: ${FST_PROXY_MEMSWAP_LIMIT:-384m}
  cpus: ${FST_PROXY_CPUS:-0.25}
  cpu_shares: 128
  pids_limit: 128

services:
  postgres:
    <<: *fst-postgres-resources
    # Custom image: postgres:17-alpine + pg_repack built from source.
    # Build with: docker build -f deploy/postgres.Dockerfile -t fst-postgres:17-repack deploy
    image: fst-postgres:17-repack
    container_name: fst-postgres
    restart: unless-stopped
    volumes:
      - ${POSTGRES_DATA_DIR:-./pg-data}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=fstservice
      - POSTGRES_USER=fst
      - POSTGRES_PASSWORD=${PG_PASSWORD:?Set PG_PASSWORD in .env}
    shm_size: 256mb
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "jit=off"
      # ── Observability (Option A Phase 0) ──
      # pg_stat_statements: per-normalized-query exec stats (query, calls, total_time, mean, rows, hits/reads)
      # auto_explain:       auto-log EXPLAIN(ANALYZE, BUFFERS) for queries slower than log_min_duration
      # After restart, run once: `CREATE EXTENSION IF NOT EXISTS pg_stat_statements;`
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,auto_explain"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "auto_explain.log_min_duration=1000ms"
      - "-c"
      - "auto_explain.log_analyze=true"
      - "-c"
      - "auto_explain.log_buffers=true"
      - "-c"
      - "auto_explain.log_timing=false"
      - "-c"
      - "auto_explain.log_nested_statements=true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fst -d fstservice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${FST_POSTGRES_MEM_LIMIT:-16G}
          cpus: ${FST_POSTGRES_CPUS:-6.0}

  fstservice:
    <<: *fst-api-resources
    image: &fstservice_image ghcr.io/sfenton/fstservice:latest
    container_name: fstservice
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes: &fstservice_volumes
      - ${FST_DATA_DIR:-./fst-data}:/app/data
    env_file:
      - ./config/fstservice-role.env
    command: ["--no-scraper-worker"]
    # API frontend only: serves requests plus lightweight song/path refresh.
    # Scrape, ranking, and band-history mutation workers belong to fstworker.
    # The web frontend is served by the festivalweb container.
    ports:
      - "127.0.0.1:8081:8080"
    environment: &fstservice_environment
      - DOTNET_ENVIRONMENT=Production
      # ── Database ──
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=fstservice;Username=fst;Password=${PG_PASSWORD:?Set PG_PASSWORD in .env};Minimum Pool Size=2;Maximum Pool Size=15;Connection Idle Lifetime=30;Connection Pruning Interval=10;Command Timeout=0
      # ── Required secrets (override defaults from appsettings.json) ──
      # Generate with: openssl rand -hex 32
      - Api__ApiKey=${API_KEY:?Set API_KEY in .env}
      # ── Epic Games OAuth client (required; no tracked credential defaults) ──
      - EPIC_CLIENT_ID=${EPIC_CLIENT_ID:?Set EPIC_CLIENT_ID in .env}
      - EPIC_CLIENT_SECRET=${EPIC_CLIENT_SECRET:?Set EPIC_CLIENT_SECRET in .env}
      # ── Leaderboard page cap (100 entries/page, default 100 pages = top 10K) ──
      - Scraper__MaxPagesPerLeaderboard=${MAX_PAGES_PER_LEADERBOARD:-100}
      # ── Sequential scrape: one song at a time, ~6×PageConcurrency concurrent requests (default: false) ──
      - Scraper__SequentialScrape=${SEQUENTIAL_SCRAPE:-false}
      # ── Pages fetched concurrently per instrument in sequential mode (default: 10 = ~60 concurrent) ──
      - Scraper__PageConcurrency=${PAGE_CONCURRENCY:-10}
      # ── Songs scraped concurrently in sequential mode (default: 1) ──
      - Scraper__SongConcurrency=${SONG_CONCURRENCY:-1}
      # ── Global scraper concurrency cap. Keep lower than appsettings default on shared API/DB hosts. ──
      - Scraper__DegreeOfParallelism=${SCRAPER_DOP:-64}
      - Scraper__DisableScraperWorker=${SCRAPER_DISABLE_SCRAPER_WORKER:-false}
      # ── Hard cap on API requests per second, 0 = unlimited (default: 0) ──
      - Scraper__MaxRequestsPerSecond=${MAX_REQUESTS_PER_SECOND:-0}
      # ── Rank-history snapshots are WAL-heavy; keep this low unless worker has a dedicated DB. ──
      - Scraper__RankHistorySnapshotMaxDegreeOfParallelism=${RANK_HISTORY_SNAPSHOT_MAX_DOP:-1}
      # ── Web registration retention in days (default: 7) ──
      - Scraper__WebRegistrationRetentionDays=${WEB_REGISTRATION_RETENTION_DAYS:-7}
      # ── Initial DOP: start low and ramp via AIMD slow-start to avoid CDN burst blocks (default: 4) ──
      - Scraper__InitialDop=${INITIAL_DOP:-4}
      # ── Bound post-scrape registered-user refresh so CDN/proxy stalls do not block rankings/notifications. ──
      - Scraper__PostScrapeRefreshTimeout=${POST_SCRAPE_REFRESH_TIMEOUT:-00:05:00}
      # ── Progressing solo refresh is uncapped; the durable no-progress watchdog owns hangs. ──
      - Scraper__RegisteredUserRefreshTimeout=${REGISTERED_USER_REFRESH_TIMEOUT:-00:00:00}
      # ── Band discovery/targeted work checkpoints each successful lookup and uses bounded per-pass budgets. ──
      - Scraper__RegisteredPlayerBandDiscoveryTimeout=${REGISTERED_PLAYER_BAND_DISCOVERY_TIMEOUT:-00:06:00}
      - Scraper__RegisteredBandTargetedProcessingTimeout=${REGISTERED_BAND_TARGETED_PROCESSING_TIMEOUT:-00:05:00}
      - Scraper__RegisteredPlayerBandDiscoveryMaxLookupsPerPass=${REGISTERED_PLAYER_BAND_DISCOVERY_MAX_LOOKUPS_PER_PASS:-80}
      - Scraper__RegisteredBandProcessingMaxLookupsPerPass=${REGISTERED_BAND_PROCESSING_MAX_LOOKUPS_PER_PASS:-80}
      # ── Registration sync gets the Epic lane while active; background scrape/band requests wait. ──
      - Scraper__RegistrationBackfillMode=${REGISTRATION_BACKFILL_MODE:-ForegroundEpicExclusive}
      # ── Path generation (MIDI decryption key for CHOpt max score calculation) ──
      - Scraper__MidiEncryptionKey=${MIDI_ENCRYPTION_KEY:-}
      # ── Persistence/publication feature flags ──
      - Features__AppManual=${FEATURE_APP_MANUAL:-false}
      - Features__WriteLegacyLiveLeaderboardSupplementalRows=${WRITE_LEGACY_LIVE_LEADERBOARD_SUPPLEMENTAL_ROWS:-true}
      - Features__UseSnapshotOverlayWorkerReaders=${USE_SNAPSHOT_OVERLAY_WORKER_READERS:-false}
      - Features__UseStoredSoloProjectionRanksForFilteredReads=${USE_STORED_SOLO_PROJECTION_RANKS_FOR_FILTERED_READS:-false}
      - ImprovementNotifications__Enabled=${IMPROVEMENT_NOTIFICATIONS_ENABLED:-true}
      - ImprovementNotifications__Scope=${IMPROVEMENT_NOTIFICATIONS_SCOPE:-registered}
      - ImprovementNotifications__IncludePlayers=${IMPROVEMENT_NOTIFICATIONS_INCLUDE_PLAYERS:-true}
      - ImprovementNotifications__IncludeBands=${IMPROVEMENT_NOTIFICATIONS_INCLUDE_BANDS:-true}
      - ImprovementNotifications__IncludeSongEvents=${IMPROVEMENT_NOTIFICATIONS_INCLUDE_SONG_EVENTS:-true}
      - ImprovementNotifications__IncludeRankings=${IMPROVEMENT_NOTIFICATIONS_INCLUDE_RANKINGS:-true}
      - ImprovementNotifications__RefreshSoloProjection=${IMPROVEMENT_NOTIFICATIONS_REFRESH_SOLO_PROJECTION:-true}
      - ImprovementNotifications__RefreshAllSoloScopesWhenNoImpactedScopes=${IMPROVEMENT_NOTIFICATIONS_REFRESH_ALL_SOLO_SCOPES_WHEN_NO_IMPACTED_SCOPES:-false}
      # Queue band history as resumable background work instead of blocking ranking publish.
      - BandRankHistory__Mode=${BAND_RANK_HISTORY_MODE:-Disabled}
      - BandRankHistory__WriteMode=${BAND_RANK_HISTORY_WRITE_MODE:-V2Only}
      - BandRankHistory__ApiReadSource=${BAND_RANK_HISTORY_API_READ_SOURCE:-V2NarrowOnly}
      - BandRankHistory__CompactV3DuetsReadEnabled=${BAND_RANK_HISTORY_COMPACT_V3_DUETS_READ_ENABLED:-true}
      - BandRankHistory__CompactV3TriosReadEnabled=${BAND_RANK_HISTORY_COMPACT_V3_TRIOS_READ_ENABLED:-true}
      - BandRankHistory__CompactV3QuadReadEnabled=${BAND_RANK_HISTORY_COMPACT_V3_QUAD_READ_ENABLED:-true}
      - BandRankHistory__UseWideHistoryCompatibilityWrite=${BAND_RANK_HISTORY_USE_WIDE_HISTORY_COMPATIBILITY_WRITE:-false}
      - BandRankHistory__ChunkSize=${BAND_RANK_HISTORY_CHUNK_SIZE:-250000}
      - BandRankHistory__RangeChunkingEnabled=${BAND_RANK_HISTORY_RANGE_CHUNKING_ENABLED:-true}
      - BandRankHistory__CommandTimeoutSeconds=${BAND_RANK_HISTORY_COMMAND_TIMEOUT_SECONDS:-0}
      - BandRankHistory__MaxRetryAttempts=${BAND_RANK_HISTORY_MAX_RETRY_ATTEMPTS:-3}
      - BandRankHistory__RetryDelaySeconds=${BAND_RANK_HISTORY_RETRY_DELAY_SECONDS:-900}
      - BandRankHistory__StaleRunningJobMinutes=${BAND_RANK_HISTORY_STALE_RUNNING_JOB_MINUTES:-15}
      # Combo-batched band-ranking writes reduce one-shot build-table pressure on tight disks.
      - BandTeamRankings__WriteMode=${BAND_TEAM_RANKINGS_WRITE_MODE:-ComboBatched}
      # Override scraper settings via environment variables if needed:
      # - Scraper__ScrapeInterval=04:00:00
      # - Scraper__SongSyncInterval=00:15:00
      # - Scraper__DegreeOfParallelism=16
      # ── Proxy rotation + VPN city cycling ──
      # Active when using gluetun proxy containers (docker compose --profile vpn up -d).
      # Each proxy needs a unique WireGuard identity (separate AirVPN device key).
      - Scraper__ExpectedProxyEndpointCount=4
      - Scraper__ProxyMaxRequestsPerSecondPerEndpoint=${PROXY_MAX_REQUESTS_PER_SECOND_PER_ENDPOINT:-0}
      - Scraper__ProxyMaxConcurrentRequestsPerEndpoint=${PROXY_MAX_CONCURRENT_REQUESTS_PER_ENDPOINT:-0}
      - Scraper__ProxyDisableConnectionReuse=${PROXY_DISABLE_CONNECTION_REUSE:-false}
      - Scraper__ProxyUseCurlTransport=${PROXY_USE_CURL_TRANSPORT:-false}
      - Scraper__ProxyCurlTempDirectory=${PROXY_CURL_TEMP_DIRECTORY:-}
      - Scraper__ProxyUrls__0=http://gluetun-1:8888
      - Scraper__ProxyUrls__1=http://gluetun-2:8888
      - Scraper__ProxyUrls__2=http://gluetun-3:8888
      - Scraper__ProxyUrls__3=http://gluetun-4:8888
      - Scraper__ControlUrls__0=http://gluetun-1:8000
      - Scraper__ControlUrls__1=http://gluetun-2:8000
      - Scraper__ControlUrls__2=http://gluetun-3:8000
      - Scraper__ControlUrls__3=http://gluetun-4:8000
      - Scraper__VpnProviders__0=AirVPN
      - Scraper__VpnProviders__1=AirVPN
      - Scraper__VpnProviders__2=AirVPN
      - Scraper__VpnProviders__3=AirVPN
      # ── Container names for Docker-based VPN recycling ──
      # When set, FSTService recreates gluetun containers (stop/rm/run) via the
      # Docker Engine API instead of using the gluetun control API. More reliable
      # when gluetun is crash-looping or WireGuard is wedged.
      - Scraper__ContainerNames__0=gluetun-1
      - Scraper__ContainerNames__1=gluetun-2
      - Scraper__ContainerNames__2=gluetun-3
      - Scraper__ContainerNames__3=gluetun-4
      # ── Docker self-heal for proxy tunnel failures (requires docker.sock + ContainerNames) ──
      - Scraper__ProxyContainerSelfHealEnabled=${PROXY_CONTAINER_SELF_HEAL_ENABLED:-false}
      - Scraper__ProxyContainerRestartFailureThreshold=${PROXY_CONTAINER_RESTART_FAILURE_THRESHOLD:-1}
      - Scraper__ProxyContainerRestartMinIntervalSeconds=${PROXY_CONTAINER_RESTART_MIN_INTERVAL_SECONDS:-300}
      - Scraper__ProxyContainerRestartCooldownSeconds=${PROXY_CONTAINER_RESTART_COOLDOWN_SECONDS:-90}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  fstworker:
    <<: *fst-worker-resources
    image: *fstservice_image
    container_name: fstworker
    # Guard-only startup: bare Compose up excludes this service; the guard
    # explicitly enables the profile for config validation and targeted starts.
    profiles: ["worker"]
    restart: "on-failure:5"
    depends_on:
      postgres:
        condition: service_healthy
      fstservice:
        condition: service_healthy
    volumes:
      - ${FST_DATA_DIR:-./fst-data}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./config/fstworker-role.env
    # Docker control is worker-only. Set DOCKER_GID to the host docker group ID.
    group_add:
      - "${DOCKER_GID:-999}"
    environment: *fstservice_environment
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  festivalweb:
    <<: *fst-web-resources
    image: ghcr.io/sfenton/fstfestivalweb:latest
    container_name: festivalweb
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    environment:
      - API_BACKEND_URL=http://fstservice:8080
    networks:
      - default
      - fst_backend
    # Start independently so the static maintenance UI can render when the API
    # or database is unavailable.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── VPN Proxy Containers ─────────────────────────────────
  # Activate with: docker compose --profile vpn up -d
  # Each container needs a unique WireGuard device key from your VPN provider.
  # The scraper rotates requests across proxies and cycles VPN cities on CDN blocks.
  #
  # Required .env variables per instance:
  #   GLUETUN_{N}_WG_PRIVATE_KEY, GLUETUN_{N}_WG_PRESHARED_KEY, GLUETUN_{N}_WG_ADDRESS
  # Shared:
  #   AIRVPN_WG_PUBLIC_KEY (default provided below)

  gluetun-1:
    <<: *fst-proxy-resources
    image: qmcgaw/gluetun
    container_name: gluetun-1
    profiles: [vpn]
    # Reap healthcheck/timeout children so long-running proxy containers do not
    # accumulate zombies between VPN rotations.
    init: true
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      - HTTPPROXY=on
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_1_WG_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_1_WG_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${GLUETUN_1_WG_ADDRESS}
      - WIREGUARD_PUBLIC_KEY=${AIRVPN_WG_PUBLIC_KEY:-PyLCXAQT8KkM4T+dUsOQfn+Ub3pGxfGlxkIApuig+hk=}
      - SERVER_CITIES=${GLUETUN_1_CITY:-Los Angeles}
      - WIREGUARD_MTU=1320
      - UPDATER_PERIOD=24h
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/v1/vpn/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  gluetun-2:
    <<: *fst-proxy-resources
    image: qmcgaw/gluetun
    container_name: gluetun-2
    profiles: [vpn]
    # Reap healthcheck/timeout children so long-running proxy containers do not
    # accumulate zombies between VPN rotations.
    init: true
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      - HTTPPROXY=on
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_2_WG_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_2_WG_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${GLUETUN_2_WG_ADDRESS}
      - WIREGUARD_PUBLIC_KEY=${AIRVPN_WG_PUBLIC_KEY:-PyLCXAQT8KkM4T+dUsOQfn+Ub3pGxfGlxkIApuig+hk=}
      - SERVER_CITIES=${GLUETUN_2_CITY:-New York City}
      - WIREGUARD_MTU=1320
      - UPDATER_PERIOD=24h
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/v1/vpn/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  gluetun-3:
    <<: *fst-proxy-resources
    image: qmcgaw/gluetun
    container_name: gluetun-3
    profiles: [vpn]
    # Reap healthcheck/timeout children so long-running proxy containers do not
    # accumulate zombies between VPN rotations.
    init: true
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      - HTTPPROXY=on
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_3_WG_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_3_WG_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${GLUETUN_3_WG_ADDRESS}
      - WIREGUARD_PUBLIC_KEY=${AIRVPN_WG_PUBLIC_KEY:-PyLCXAQT8KkM4T+dUsOQfn+Ub3pGxfGlxkIApuig+hk=}
      - SERVER_CITIES=${GLUETUN_3_CITY:-London}
      - WIREGUARD_MTU=1320
      - UPDATER_PERIOD=24h
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/v1/vpn/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  gluetun-4:
    <<: *fst-proxy-resources
    image: qmcgaw/gluetun
    container_name: gluetun-4
    profiles: [vpn]
    # Reap healthcheck/timeout children so long-running proxy containers do not
    # accumulate zombies between VPN rotations.
    init: true
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      - HTTPPROXY=on
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_4_WG_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_4_WG_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${GLUETUN_4_WG_ADDRESS}
      - WIREGUARD_PUBLIC_KEY=${AIRVPN_WG_PUBLIC_KEY:-PyLCXAQT8KkM4T+dUsOQfn+Ub3pGxfGlxkIApuig+hk=}
      - SERVER_CITIES=${GLUETUN_4_CITY:-Tokyo}
      - WIREGUARD_MTU=1320
      - UPDATER_PERIOD=24h
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/v1/vpn/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  fst_backend:
    external: true
    name: festivalservicetracker_default
